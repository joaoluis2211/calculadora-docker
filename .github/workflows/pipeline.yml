name: Docker Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_USER: ${{ vars.DOCKER_USER }}

jobs:
  build:
    name: Build com Compose
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Construir imagem
        run: docker compose build

      - name: Enviar imagem da calculadora
        run: docker compose push calculadora-app

  test:
    name: Testes com Compose
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Baixar imagens
        run: docker compose pull

      - name: Subir ambiente
        run: docker compose up -d --no-build

      - name: Testar comunicação
        run: docker compose exec -T calculadora-app ping -c 4 servico-vizinho

      - name: Executar testes unitários
        run: docker compose exec -T calculadora-app python -m unittest -v

      - name: Mostrar logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Encerrar ambiente
        if: always()
        run: docker compose down