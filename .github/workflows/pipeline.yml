name: Docker Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build da imagem
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Construir e enviar imagem
        run: |
          docker build -t "$DOCKER_USER/calculadora-docker:$GITHUB_SHA" .
          docker push "$DOCKER_USER/calculadora-docker:$GITHUB_SHA"
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}

  test:
    name: Testes no container
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Baixar imagem e executar testes
        run: |
          docker pull "$DOCKER_USER/calculadora-docker:$GITHUB_SHA"
          docker run --rm "$DOCKER_USER/calculadora-docker:$GITHUB_SHA" python -m unittest -v
        env:
          DOCKER_USER: ${{ vars.DOCKER_USER }}